name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check --quiet

      - name: Check formatting with ruff
        run: uv run ruff format --check --quiet

      - name: Run unit tests
        run: uv run pytest -q --tb=short --no-header

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t web-scraper:ci .

      - name: Smoke-test CLI help inside container
        run: docker run --rm web-scraper:ci --help
